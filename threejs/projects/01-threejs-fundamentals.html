<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Three.js Fundamentals</title>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="importmap">{
    "imports": {
      "three": "https://unpkg.com/three@0.186.0/build/three.webgpu.js",
      "three/webgpu": "https://unpkg.com/three@0.186.0/build/three.webgpu.js",
      "three/tsl": "https://unpkg.com/three@0.186.0/build/three.tsl.js",
      "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
    }
  }</script>
  <script type="module">
    import * as THREE from 'three/webgpu';

    async function main() {

      const canvas = document.querySelector( '#c' );
      const renderer = new THREE.WebGPURenderer( { antialias: true, canvas, alpha: false } );

      const fov = 75;
      const aspect = 2; // the canvas default
      const near = 0.1;
      const far = 5;
      const camera = new THREE.PerspectiveCamera( fov, aspect, near, far );
      camera.position.z = 2;

      const scene = new THREE.Scene();

      const boxWidth = 1;
      const boxHeight = 1;
      const boxDepth = 1;
      const geometry = new THREE.BoxGeometry( boxWidth, boxHeight, boxDepth );

      const material = new THREE.MeshBasicMaterial( { color: 0x44aa88 } ); // greenish blue

      const cube = new THREE.Mesh( geometry, material );
      scene.add( cube );

      await renderer.init();
      renderer.render( scene, camera );

    }

    main();
  </script>
</body>
</html>
