<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU</title>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    const canvas = document.querySelector('#c');

    if (!navigator.gpu) {
      document.body.textContent = 'WebGPU is not supported in this browser';
      throw new Error('WebGPU not supported');
    }
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();

    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: 'premultiplied' });

    const shaderModule = device.createShaderModule({ code: `
      struct Uniforms {
        time: f32,
      };
      @group(0) @binding(0) var<uniform> uniforms: Uniforms;

      struct VertexOutput {
        @builtin(position) position: vec4f,
        @location(0) color: vec3f,
      };

      @vertex
      fn vertexMain(@location(0) position: vec2f) -> VertexOutput {
        // move every vertex up or down, depending on its x position and the time
        let wave = sin(position.x * 6.0 + uniforms.time * 2.0) * 0.08;

        var output: VertexOutput;
        output.position = vec4f(position.x, position.y + wave, 0.0, 1.0);
        // the color is calculated per vertex as well, and interpolated over the triangle
        output.color = vec3f(0.5 + 0.5 * sin(uniforms.time + position.x * 3.0), 0.6, 1.0 - wave * 5.0);
        return output;
      }

      @fragment
      fn fragmentMain(@location(0) color: vec3f) -> @location(0) vec4f {
        return vec4f(color, 1.0);
      }
    `});

    const pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: shaderModule,
        entryPoint: 'vertexMain',
        // describe how the data in our vertex buffer is organised
        buffers: [{
          arrayStride: 2 * 4, // 2 floats of 4 bytes per vertex
          attributes: [
            { shaderLocation: 0, offset: 0, format: 'float32x2' }, // @location(0) position: vec2f
          ],
        }],
      },
      fragment: { module: shaderModule, entryPoint: 'fragmentMain', targets: [{ format }] },
    });

    const uniforms = { time: 0 };
    const uniformValues = new Float32Array(4);
    const setUniform = (name, ...values) => uniformValues.set(values, uniforms[name]);
    const uniformBuffer = device.createBuffer({
      size: uniformValues.byteLength,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    // a grid of small squares (2 triangles each), in clip space (-1 to 1)
    const cols = 40;
    const rows = 40;
    const positions = [];
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const x0 = -1 + (col + 0.1) * 2 / cols;
        const x1 = -1 + (col + 0.9) * 2 / cols;
        const y0 = -1 + (row + 0.1) * 2 / rows;
        const y1 = -1 + (row + 0.9) * 2 / rows;
        positions.push(
          x0, y1,
          x1, y1,
          x0, y0,

          x0, y0,
          x1, y1,
          x1, y0,
        );
      }
    }
    const vertexData = new Float32Array(positions);
    const vertexCount = vertexData.length / 2;

    const vertexBuffer = device.createBuffer({
      size: vertexData.byteLength,
      usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(vertexBuffer, 0, vertexData);

    const bindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuffer } },
      ],
    });

    const init = () => {
      canvas.width = 1024;
      canvas.height = 768;

      drawScene();
    };

    const drawScene = (time = 0) => {
      setUniform('time', time / 1000);
      device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: [0.05, 0.05, 0.1, 1],
          loadOp: 'clear',
          storeOp: 'store',
        }],
      });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.setVertexBuffer(0, vertexBuffer);
      pass.draw(vertexCount);
      pass.end();
      device.queue.submit([encoder.finish()]);

      requestAnimationFrame(drawScene);
    };

    init();
  </script>
</body>
</html>
