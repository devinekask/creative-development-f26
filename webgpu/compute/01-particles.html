<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU</title>
  <style>
    #fps {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 4px 8px;
      font: 14px monospace;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="fps"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>

  <script type="module">
    const canvas = document.querySelector('#c');
    const fpsElement = document.querySelector('#fps');

    if (!navigator.gpu) {
      document.body.textContent = 'WebGPU is not supported in this browser';
      throw new Error('WebGPU not supported');
    }
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();

    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: 'premultiplied' });

    const particleCount = 200000;

    const shaderModule = device.createShaderModule({ code: `
      struct Uniforms {
        mouse: vec2f,
        deltaTime: f32,
        attract: f32,
        aspect: f32,
      };

      struct Particle {
        position: vec2f,
        velocity: vec2f,
      };

      @group(0) @binding(0) var<uniform> uniforms: Uniforms;
      // the compute shader needs to write to the particles, the vertex shader is only allowed to read
      // (two names for the same buffer, each shader uses one of them)
      @group(0) @binding(1) var<storage, read_write> particles: array<Particle>;
      @group(0) @binding(1) var<storage, read> particlesReadOnly: array<Particle>;

      // ---- compute shader: runs once for every particle ----

      @compute @workgroup_size(64)
      fn simulate(@builtin(global_invocation_id) id: vec3u) {
        let i = id.x;
        // we launch a multiple of 64 invocations, so some might be out of range
        if (i >= arrayLength(&particles)) {
          return;
        }

        var p = particles[i];

        // per-particle randomness, calculated from the particle index (a classic shader "random" trick)
        // this gives the same value every frame for the same particle
        let random = fract(sin(f32(i) * 12.9898) * 43758.5453);
        let random2 = fract(sin(f32(i) * 78.233) * 43758.5453);

        let toMouse = uniforms.mouse - p.position;
        let dist = length(toMouse);
        let direction = toMouse / max(dist, 0.001);
        // a vector at 90 degrees to the direction of the mouse
        let tangent = vec2f(-direction.y, direction.x);
        // half of the particles rotate clockwise, the other half counter clockwise
        let spin = select(-1.0, 1.0, random > 0.5);

        // pull towards the mouse. The closer the particle gets, the weaker the pull, so it overshoots instead of stopping
        let pull = direction * smoothstep(0.0, 0.4, dist) * (2.0 + random2 * 2.0);
        // push sideways: this is what makes the particles rotate around the mouse
        let swirl = tangent * spin * (0.5 + random) * 2.0;

        p.velocity += (pull + swirl) * uniforms.attract * uniforms.deltaTime;
        // a little bit of drag
        p.velocity *= 0.995;

        // every particle has its own speed limit: faster particles end up in a bigger orbit
        let maxSpeed = 0.3 + random * 0.7;
        let speed = length(p.velocity);
        if (speed > maxSpeed) {
          p.velocity *= maxSpeed / speed;
        }

        p.position += p.velocity * uniforms.deltaTime;

        // bounce at the edges
        if (abs(p.position.x) > 1.0) {
          p.velocity.x = -p.velocity.x;
        }
        if (abs(p.position.y) > 1.0) {
          p.velocity.y = -p.velocity.y;
        }

        particles[i] = p;
      }

      // ---- render shaders: draw a small square for every particle ----

      struct VertexOutput {
        @builtin(position) position: vec4f,
        @location(0) color: vec3f,
      };

      @vertex
      fn vertexMain(@builtin(vertex_index) vertexIndex: u32, @builtin(instance_index) instanceIndex: u32) -> VertexOutput {
        let corners = array(
          vec2f(-1.0,  1.0),
          vec2f( 1.0,  1.0),
          vec2f(-1.0, -1.0),

          vec2f(-1.0, -1.0),
          vec2f( 1.0,  1.0),
          vec2f( 1.0, -1.0),
        );
        let particle = particlesReadOnly[instanceIndex];
        let size = vec2f(0.003, 0.003 * uniforms.aspect);

        var output: VertexOutput;
        output.position = vec4f(particle.position + corners[vertexIndex] * size, 0.0, 1.0);
        let speed = length(particle.velocity);
        output.color = mix(vec3f(0.2, 0.5, 1.0), vec3f(1.0, 0.9, 0.3), min(speed, 1.0));
        return output;
      }

      @fragment
      fn fragmentMain(@location(0) color: vec3f) -> @location(0) vec4f {
        return vec4f(color, 1.0);
      }
    `});

    const computePipeline = device.createComputePipeline({
      layout: 'auto',
      compute: { module: shaderModule, entryPoint: 'simulate' },
    });

    const renderPipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: shaderModule, entryPoint: 'vertexMain' },
      fragment: { module: shaderModule, entryPoint: 'fragmentMain', targets: [{ format }] },
    });

    // the offsets (in floats) of each uniform value, must match the Uniforms struct in the shader
    // a vec2f takes 2 floats, the total size is rounded up to a multiple of 4
    const uniforms = { mouse: 0, deltaTime: 2, attract: 3, aspect: 4 };
    const uniformValues = new Float32Array(8);
    const setUniform = (name, ...values) => uniformValues.set(values, uniforms[name]);
    const uniformBuffer = device.createBuffer({
      size: uniformValues.byteLength,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    // every particle is 4 floats: position x, position y, velocity x, velocity y
    const particleData = new Float32Array(particleCount * 4);
    for (let i = 0; i < particleCount; i++) {
      particleData[i * 4 + 0] = Math.random() * 2 - 1;
      particleData[i * 4 + 1] = Math.random() * 2 - 1;
      particleData[i * 4 + 2] = (Math.random() - 0.5) * 0.2;
      particleData[i * 4 + 3] = (Math.random() - 0.5) * 0.2;
    }
    const particleBuffer = device.createBuffer({
      size: particleData.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(particleBuffer, 0, particleData);

    // the compute pipeline and the render pipeline each have their own bind group layout
    const computeBindGroup = device.createBindGroup({
      layout: computePipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuffer } },
        { binding: 1, resource: { buffer: particleBuffer } },
      ],
    });
    const renderBindGroup = device.createBindGroup({
      layout: renderPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuffer } },
        { binding: 1, resource: { buffer: particleBuffer } },
      ],
    });

    const properties = {
      attract: 0
    };
    let mouseX = 0, mouseY = 0;
    let previousTime = 0;

    // fps counter: count the frames, update the text once per second
    let frames = 0;
    let fpsTime = 0;

    const init = () => {
      canvas.width = 1024;
      canvas.height = 768;

      setUniform('aspect', canvas.width / canvas.height);

      canvas.addEventListener('mousemove', e => {
        // convert the mouse position to clip space (-1 to 1, y up)
        mouseX = map(e.offsetX, 0, canvas.clientWidth, -1, 1);
        mouseY = map(e.offsetY, 0, canvas.clientHeight, 1, -1);
      });
      canvas.addEventListener('mouseover', () => gsap.to(properties, { duration: 1, ease: "power4.out", attract: 1}));
      canvas.addEventListener('mouseout', () => gsap.to(properties, { duration: 1, ease: "power4.out", attract: 0}));

      drawScene();
    };

    const drawScene = (time = 0) => {
      const deltaTime = Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;

      frames++;
      if (time - fpsTime >= 1000) {
        fpsElement.textContent = `${frames} fps`;
        frames = 0;
        fpsTime = time;
      }

      setUniform('mouse', mouseX, mouseY);
      setUniform('deltaTime', deltaTime);
      setUniform('attract', properties.attract);
      device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

      const encoder = device.createCommandEncoder();

      // 1. update the particles on the gpu
      const computePass = encoder.beginComputePass();
      computePass.setPipeline(computePipeline);
      computePass.setBindGroup(0, computeBindGroup);
      computePass.dispatchWorkgroups(Math.ceil(particleCount / 64));
      computePass.end();

      // 2. draw the particles
      const renderPass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: [0.05, 0.05, 0.1, 1],
          loadOp: 'clear',
          storeOp: 'store',
        }],
      });
      renderPass.setPipeline(renderPipeline);
      renderPass.setBindGroup(0, renderBindGroup);
      renderPass.draw(6, particleCount); // 6 vertices, drawn particleCount times
      renderPass.end();

      device.queue.submit([encoder.finish()]);

      requestAnimationFrame(drawScene);
    };

    const map = (value, x1, y1, x2, y2) => (value - x1) * (y2 - x2) / (y1 - x1) + x2;

    init();
  </script>
</body>
</html>
