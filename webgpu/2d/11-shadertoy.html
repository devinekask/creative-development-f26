<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU</title>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    const canvas = document.querySelector('#c');

    if (!navigator.gpu) {
      document.body.textContent = 'WebGPU is not supported in this browser';
      throw new Error('WebGPU not supported');
    }
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();

    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: 'premultiplied' });

    const shaderModule = device.createShaderModule({ code: `
      struct VertexOutput {
        @builtin(position) position: vec4f,
        @location(0) uv: vec2f,
      };

      @vertex
      fn vertexMain(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
        // 2 triangles, filling the whole canvas
        let positions = array(
          vec2f(-1.0,  1.0),
          vec2f( 1.0,  1.0),
          vec2f(-1.0, -1.0),

          vec2f(-1.0, -1.0),
          vec2f( 1.0,  1.0),
          vec2f( 1.0, -1.0),
        );
        let position = positions[vertexIndex];

        var output: VertexOutput;
        output.position = vec4f(position, 0.0, 1.0);
        // convert clip space (-1 to 1, y up) to uv space (0 to 1, y down)
        output.uv = vec2f(position.x + 1.0, 1.0 - position.y) * 0.5;
        return output;
      }

      struct Uniforms {
        iResolution: vec2f,
        iTime: f32,
      };
      @group(0) @binding(0) var<uniform> uniforms: Uniforms;
      @group(0) @binding(1) var iSampler: sampler;
      @group(0) @binding(2) var iChannel0: texture_2d<f32>;

      // https://www.shadertoy.com/view/Xsl3zn - translated from GLSL to WGSL
      fn mainImage(fragCoord: vec2f) -> vec4f {
        let iResolution = uniforms.iResolution;
        let iTime = uniforms.iTime;

        let uv = fragCoord / iResolution.xy;

        let freq = 3.0 * sin(0.5 * iTime);
        let warp = 0.5000 * cos(uv.xy * 1.0 * freq + vec2f(0.0, 1.0) + iTime) +
                   0.2500 * cos(uv.yx * 2.3 * freq + vec2f(1.0, 2.0) + iTime) +
                   0.1250 * cos(uv.xy * 4.1 * freq + vec2f(5.0, 3.0) + iTime) +
                   0.0625 * cos(uv.yx * 7.9 * freq + vec2f(3.0, 4.0) + iTime);

        let st = uv + warp * 0.5;

        let smoothX = 2.0 / iResolution.x;
        let smoothY = smoothX * iResolution.x / iResolution.y;

        var mask = smoothstep(0.0, smoothX, st.x);
        mask *= 1.0 - smoothstep(1.0 - smoothX, 1.0, st.x);

        mask *= smoothstep(0.0, smoothY, st.y);
        mask *= 1.0 - smoothstep(1.0 - smoothY, 1.0, st.y);

        return vec4f(textureSample(iChannel0, iSampler, st).xyz * mask, mask);
      }

      @fragment
      fn fragmentMain(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
        return mainImage(fragCoord.xy);
      }
    `});

    const pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: shaderModule, entryPoint: 'vertexMain' },
      fragment: { module: shaderModule, entryPoint: 'fragmentMain', targets: [{ format }] },
    });

    const sampler = device.createSampler({
      magFilter: 'linear',
      minFilter: 'linear',
      addressModeU: 'clamp-to-edge',
      addressModeV: 'clamp-to-edge',
    });

    // the offsets (in floats) of each uniform value, must match the Uniforms struct in the shader
    // a vec2f takes 2 floats
    const uniforms = { iResolution: 0, iTime: 2 };
    const uniformValues = new Float32Array(4);
    const setUniform = (name, ...values) => uniformValues.set(values, uniforms[name]);
    const uniformBuffer = device.createBuffer({
      size: uniformValues.byteLength,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    let bindGroup;

    const init = async () => {
      const imgTexture = await loadImage("images/devine_selectie-087.jpg");
      const texture = createTextureFromImage(imgTexture);

      bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: sampler },
          { binding: 2, resource: texture.createView() },
        ],
      });

      canvas.width = imgTexture.width;
      canvas.height = imgTexture.height;

      drawScene();
    };

    const drawScene = (time = 0) => {
      setUniform('iResolution', canvas.width, canvas.height);
      setUniform('iTime', time / 1000);
      device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: [0, 0, 0, 0],
          loadOp: 'clear',
          storeOp: 'store',
        }],
      });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.draw(6); // 2 triangles = 6 vertices
      pass.end();
      device.queue.submit([encoder.finish()]);

      requestAnimationFrame(drawScene);
    };

    const loadImage = async (src) => {
      const response = await fetch(src);
      const blob = await response.blob();
      return createImageBitmap(blob);
    };

    const map = (value, x1, y1, x2, y2) => (value - x1) * (y2 - x2) / (y1 - x1) + x2;

    const createTextureFromImage = (image) => {
      const texture = device.createTexture({
        size: [image.width, image.height],
        format: 'rgba8unorm',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
      });
      device.queue.copyExternalImageToTexture({ source: image }, { texture }, [image.width, image.height]);
      return texture;
    };

    init();
  </script>
</body>
</html>
